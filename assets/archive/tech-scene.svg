      <stop offset="55%" stop-color="#e7f1f8"/>
      <stop offset="100%" stop-color="#d5e6f0"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9cdda"/>
      <stop offset="100%" stop-color="#cfe0ea"/>
