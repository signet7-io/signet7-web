<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Signet7</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="taskpane.js"></script>
    <link rel="stylesheet" href="signet7.css" />
  </head>
  <body>
    <div class="brand">
      <img src="icon-48.png" width="36" height="36" alt="Signet7" />
      <h1>Signet7</h1>
    </div>
    <p class="muted">Recipient check stays free. Passive check. Unsigned mail stays quiet. A warning pops only when a seal is broken, replayed, or revoked. Verified is not safe. Unknown is not fraud.</p>
    <label>API base <input id="baseUrl" value="https://verify.signet7.io" /></label>
    <button id="verifyBtn" class="primary" type="button">Check this message now</button>
    <pre id="out">Watching this message…</pre>
    <label>Feedback <textarea id="feedbackText" rows="4" placeholder="Type a note. Press Send."></textarea></label>
    <button id="feedbackBtn" type="button">Send feedback</button>
    <p id="feedbackOut" class="muted"></p>
  </body>
</html>
